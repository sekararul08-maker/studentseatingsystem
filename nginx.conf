# ============================================================================
# NGINX CONFIG SYNTAX — Smart Examination Hall Seating Allocation System
# Only one nginx config: frontend/nginx.conf (used by frontend/Dockerfile
# to serve the built React app and proxy /api to the backend container)
# ============================================================================

# ==== FILE: frontend/nginx.conf ====
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
